<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 禁止瀏覽器快取 Meta 標籤 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>主審宣言</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', 'Noto Sans TC', sans-serif;
            background: #f5f3f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem 1rem;
        }

        .app-container {
            max-width: 900px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 8px 16px rgba(0, 0, 0, 0.06);
            padding: 2rem;
            transition: box-shadow 0.2s;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2.2rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid #e6e2db;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .toggle-switch {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            user-select: none;
            background: #f0ede8;
            padding: 0.45rem 0.9rem 0.45rem 1rem;
            border-radius: 40px;
            transition: background 0.2s;
        }

        .toggle-switch:hover {
            background: #e6e1da;
        }

        .toggle-switch input {
            display: none;
        }

        .toggle-slider {
            position: relative;
            width: 44px;
            height: 24px;
            background: #b9b1a8;
            border-radius: 40px;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .toggle-slider::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        input:checked + .toggle-slider {
            background: #2b6e4f;
        }

        input:checked + .toggle-slider::after {
            transform: translateX(20px);
        }

        .toggle-label {
            font-size: 0.95rem;
            font-weight: 500;
            color: #2e2a26;
            letter-spacing: 0.02em;
        }

        .action-btn {
            border: none;
            padding: 0.55rem 1.1rem;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
            letter-spacing: 0.02em;
            font-family: inherit;
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        .save-btn {
            background: #2b6e4f;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(43, 110, 79, 0.25);
        }

        .save-btn:hover {
            background: #235c42;
        }

        .reset-btn {
            background: #f0ede8;
            color: #7a3b3b;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
        }

        .reset-btn:hover {
            background: #ffe6e6;
            color: #a02020;
        }
